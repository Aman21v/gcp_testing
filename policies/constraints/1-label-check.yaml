apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata:
  name: deployments-and-namespaces-must-have-org-labels
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Namespace"]
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    namespaces:
      - "test"
      - "default"
  parameters:
    labels: ["team-id", "cost-center", "env"]
