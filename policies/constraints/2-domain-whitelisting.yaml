apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8salloweddomain
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedDomain
      validation:
        openAPIV3Schema:
          properties:
            domains:
              type: array
              items:
                type: string
          required:
          - domains
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8salloweddomain

        # 1. Handle Standard Kubernetes Ingress
        violation[{"msg": msg}] {
          input.review.kind.kind == "Ingress"
          host := input.review.object.spec.rules[_].host
          not is_allowed_domain(host, input.parameters.domains)
          msg := sprintf("Ingress host '%v' is not allowed.", [host])
        }

        # 2. Handle GKE/Kubernetes Gateway API (HTTPRoute)
        violation[{"msg": msg}] {
          input.review.kind.kind == "HTTPRoute"
          host := input.review.object.spec.hostnames[_]
          not is_allowed_domain(host, input.parameters.domains)
          msg := sprintf("HTTPRoute hostname '%v' is not allowed.", [host])
        }

        # Helper: Logic for wildcard and exact match
        is_allowed_domain(host, domains) {
          domain := domains[_]
          endswith(host, trim_prefix(domain, "*"))
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedDomain
metadata:
  name: allow-corporate-domains
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["networking.k8s.io"]
        kinds: ["Ingress"]
      - apiGroups: ["gateway.networking.k8s.io"]
        kinds: ["HTTPRoute"]
  parameters:
    domains:
      - "*.mycompany.com"
      - "internal-service.local"
